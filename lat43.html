
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penjumlahan Dua Bilangan</title>
</head>
<body>

    <h2>Penjumlahan Dua Bilangan</h2>

    <label>Bilangan pertama:</label>
    <input type="number" id="bilangan1">

    <br><br>

    <label>Bilangan kedua:</label>
    <input type="number" id="bilangan2">

    <br><br>

    <button onclick="jumlahkan()">Jumlahkan</button>

    <p id="hasil"></p>

    <script>
        function jumlahkan() {
            const a = document.getElementById("bilangan1").value;
            const b = document.getElementById("bilangan2").value;
            const hasil = document.getElementById("hasil");

            if (a === "" || b === "") {
                hasil.textContent = "Silakan masukkan kedua bilangan.";
                return;
            }

            const jumlah = Number(a) + Number(b);
            hasil.textContent = "Hasil penjumlahan: " + jumlah;
        }
    </script>

</body>
</html>
