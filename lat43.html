
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algoritma Fibonacci dan Penjumlahan</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container py-4">

        <div class="card shadow p-4 mb-4">
            <h3 class="text-primary">Deret Fibonacci</h3>
            <p>Menghitung nilai suku ke-20.</p>

            <button class="btn btn-primary" onclick="hitungFibonacci()">
                Hitung Fibonacci
            </button>

            <p id="hasilFibonacci" class="mt-3 fw-bold"></p>
        </div>

        <div class="card shadow p-4">
            <h3 class="text-success">Penjumlahan Dua Bilangan</h3>

            <label for="bilangan1" class="form-label">
                Bilangan pertama:
            </label>
            <input type="number" id="bilangan1" class="form-control mb-3"
                   placeholder="Masukkan bilangan pertama">

            <label for="bilangan2" class="form-label">
                Bilangan kedua:
            </label>
            <input type="number" id="bilangan2" class="form-control mb-3"
                   placeholder="Masukkan bilangan kedua">

            <button class="btn btn-success" onclick="jumlahkan()">
                Jumlahkan
            </button>

            <p id="hasilJumlah" class="mt-3 fw-bold"></p>
        </div>

    </div>

    <script>
        // Algoritma Fibonacci suku ke-20
        function hitungFibonacci() {
            let a = 0;
            let b = 1;

            for (let i = 3; i <= 20; i++) {
                let c = a + b;
                a = b;
                b = c;
            }

            document.getElementById("hasilFibonacci").textContent =
                "Suku ke-20 Fibonacci adalah " + b;
        }

        // Algoritma penjumlahan dua bilangan
        function jumlahkan() {
            const input1 = document.getElementById("bilangan1").value;
            const input2 = document.getElementById("bilangan2").value;
            const hasil = document.getElementById("hasilJumlah");

            if (input1 === "" || input2 === "") {
                hasil.textContent = "Masukkan kedua bilangan terlebih dahulu.";
                hasil.className = "mt-3 fw-bold text-danger";
                return;
            }

            const a = Number(input1);
            const b = Number(input2);
            const total = a + b;

            hasil.textContent = "Hasil penjumlahan: " + total;
            hasil.className = "mt-3 fw-bold text-success";
        }
    </script>
</body>
</html>
