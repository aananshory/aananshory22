
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Penghitung Usia</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background-color: #f0f4f8;
        }

        .container {
            max-width: 500px;
            margin-top: 80px;
        }

        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="card p-4">
            <h3 class="text-center mb-4">Hitung Usia Kamu</h3>

            <label for="tanggalLahir" class="form-label">
                Tanggal lahir kamu:
            </label>

            <input type="date"
                   id="tanggalLahir"
                   class="form-control">

            <p id="hasilUsia" class="mt-3 text-primary fw-bold"></p>
        </div>
    </div>

    <script>
        const inputTanggal = document.getElementById("tanggalLahir");
        const hasilUsia = document.getElementById("hasilUsia");

        // Maksimal tanggal lahir adalah hari ini
        inputTanggal.max = new Date().toLocaleDateString("en-CA");

        inputTanggal.addEventListener("input", function () {
            if (!inputTanggal.value) {
                hasilUsia.textContent = "";
                return;
            }

            const lahir = new Date(inputTanggal.value + "T00:00:00");
            const sekarang = new Date();

            // Validasi tanggal lahir
            if (isNaN(lahir.getTime()) || lahir > sekarang) {
                hasilUsia.textContent =
                    "Masukkan tanggal lahir yang valid.";
                return;
            }

            let tahun = sekarang.getFullYear() - lahir.getFullYear();
            let bulan = sekarang.getMonth() - lahir.getMonth();
            let hari = sekarang.getDate() - lahir.getDate();

            if (hari < 0) {
                bulan--;

                const jumlahHariBulanLalu = new Date(
                    sekarang.getFullYear(),
                    sekarang.getMonth(),
                    0
                ).getDate();

                hari += jumlahHariBulanLalu;
            }

            if (bulan < 0) {
                tahun--;
                bulan += 12;
            }

            hasilUsia.textContent =
                `Kamu sudah berusia ${tahun} tahun ${bulan} bulan ${hari} hari.`;
        });
    </script>

</body>
</html>
