
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usia Saya</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-5">
        <div class="card p-4 shadow mx-auto" style="max-width: 400px;">

            <h3 class="text-center text-primary mb-4">
                Hitung Usia
            </h3>

            <label for="tgl" class="form-label">
                Tanggal lahir kamu:
            </label>

            <input type="date" id="tgl" class="form-control"
                   onchange="hitungUsia()">

            <p id="pesan" class="mt-3 text-success fw-bold"></p>

        </div>
    </div>

    <script>
        function hitungUsia() {
            let tanggalLahir = document.getElementById("tgl").value;
            let pesan = document.getElementById("pesan");

            if (tanggalLahir === "") {
                pesan.innerHTML = "";
                return;
            }

            let lahir = new Date(tanggalLahir + "T00:00:00");
            let sekarang = new Date();

            if (lahir > sekarang) {
                pesan.innerHTML = "Tanggal lahir tidak valid!";
                pesan.className = "mt-3 text-danger fw-bold";
                return;
            }

            let usia = sekarang.getFullYear() - lahir.getFullYear();

            if (
                sekarang.getMonth() < lahir.getMonth() ||
                (sekarang.getMonth() === lahir.getMonth() &&
                 sekarang.getDate() < lahir.getDate())
            ) {
                usia--;
            }

            pesan.innerHTML = "Kamu sudah berusia " + usia + " tahun.";
            pesan.className = "mt-3 text-success fw-bold";
        }
    </script>

</body>
        </html>
