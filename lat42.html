
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penghitung Usia</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container py-5">
        <div class="card shadow-sm p-4 mx-auto" style="max-width: 450px;">

            <h3 class="mb-4 text-primary">Cek Usia Kamu</h3>

            <label for="tanggalLahir" class="form-label">
                Tanggal lahir kamu:
            </label>

            <input type="date"
                   id="tanggalLahir"
                   class="form-control">

            <p id="hasil" class="mt-3 mb-0"></p>

        </div>
    </div>

    <script>
        const inputTanggal = document.getElementById("tanggalLahir");
        const hasil = document.getElementById("hasil");

        // Maksimal tanggal lahir adalah hari ini
        const hariIni = new Date();
        const tahun = hariIni.getFullYear();
        const bulan = String(hariIni.getMonth() + 1).padStart(2, "0");
        const tanggal = String(hariIni.getDate()).padStart(2, "0");

        inputTanggal.max = `${tahun}-${bulan}-${tanggal}`;

        inputTanggal.addEventListener("input", function () {
            if (!this.value) {
                hasil.textContent = "";
                return;
            }

            const lahir = new Date(this.value + "T00:00:00");
            const sekarang = new Date();

            if (isNaN(lahir.getTime()) || lahir > sekarang) {
                hasil.textContent = "Masukkan tanggal lahir yang valid.";
                hasil.className = "mt-3 text-danger";
                return;
            }

            let usia = sekarang.getFullYear() - lahir.getFullYear();

            const belumUlangTahun =
                sekarang.getMonth() < lahir.getMonth() ||
                (sekarang.getMonth() === lahir.getMonth() &&
                 sekarang.getDate() < lahir.getDate());

            if (belumUlangTahun) {
                usia--;
            }

            hasil.textContent = `Kamu sudah berusia ${usia} tahun.`;
            hasil.className = "mt-3 text-success fw-bold";
        });
    </script>

</body>
    </html>
