
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tanggal Lahir dan Usia</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container py-5">
        <div class="card shadow p-4 mx-auto"
             style="max-width: 400px;">

            <h3 class="text-center text-primary mb-4">
                Biodata Saya
            </h3>

            <label for="tanggalLahir" class="form-label">
                Tanggal lahir kamu:
            </label>

            <input type="date"
                   id="tanggalLahir"
                   class="form-control"
                   value="2005-09-22"
                   readonly>

            <p id="hasil" class="mt-3 text-success fw-bold"></p>

        </div>
    </div>

    <script>
        function tampilkanUsia() {
            const tanggalLahir = new Date("2005-09-22T00:00:00");
            const hariIni = new Date();

            let usia = hariIni.getFullYear()
                     - tanggalLahir.getFullYear();

            if (
                hariIni.getMonth() < tanggalLahir.getMonth() ||
                (hariIni.getMonth() === tanggalLahir.getMonth() &&
                 hariIni.getDate() < tanggalLahir.getDate())
            ) {
                usia--;
            }

            document.getElementById("hasil").textContent =
                "Kamu sudah berusia " + usia + " tahun.";
        }

        tampilkanUsia();
    </script>

</body>
   
</html>
